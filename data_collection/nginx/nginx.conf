events {
    worker_connections 1024;
}

http {
    # Upstream configuration for load balancing
    # host.docker.internal allows container to reach host machine
    upstream data_collection_servers {
        least_conn;
        
        # Data collection servers running on host machine
        server host.docker.internal:5000 weight=1;
        server host.docker.internal:8000 weight=1;
        
        keepalive 32;
    }

    # Logging
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status - upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        client_max_body_size 500M;
        
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /lb-status {
            access_log off;
            return 200 'Load Balancer Active';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://data_collection_servers;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
    }
}
